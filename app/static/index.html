<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MStudent</title>
<style>
  :root { --bg:#f7f7f5; --panel:#fff; --fg:#1d1d1b; --muted:#6b6b66; --line:#e4e4df; --accent:#2f5bd3; --high:#c4312b; --med:#b7791f; --low:#4a7c59; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161615; --panel:#1f1f1d; --fg:#ecece8; --muted:#a0a09a; --line:#33332f; --accent:#7d9bff; --high:#ff7a70; --med:#e3b25a; --low:#7fbf8f; } }
  * { box-sizing:border-box }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--fg) }
  header { padding:16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; flex-wrap:wrap }
  header h1 { margin:0; font-size:20px } .pill { font-size:12px; padding:2px 8px; border:1px solid var(--line); border-radius:99px; color:var(--muted) }
  main { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.4fr); gap:16px; padding:16px; max-width:1200px; margin:auto }
  @media (max-width:820px) { main { grid-template-columns:1fr } }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px }
  h2 { font-size:15px; margin:0 0 10px }
  textarea, select, input { width:100%; font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px }
  textarea { min-height:120px; resize:vertical }
  button { font:inherit; border:0; border-radius:8px; padding:8px 14px; background:var(--accent); color:#fff; cursor:pointer }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--line) }
  .row { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap }
  .task { border-top:1px solid var(--line); padding:10px 0; display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:start }
  .dot { width:10px; height:10px; border-radius:50%; margin-top:6px } .high{background:var(--high)} .medium{background:var(--med)} .low{background:var(--low)}
  .meta { color:var(--muted); font-size:13px }
  .tag { font-size:12px; border:1px solid var(--line); border-radius:99px; padding:0 6px; margin-right:4px }
  pre { white-space:pre-wrap; margin:0; font:inherit }
  #log { font-size:13px; color:var(--muted); max-height:180px; overflow:auto }
</style>
</head>
<body>
<header>
  <h1>📥 MStudent</h1><span class="pill" id="mode">…</span>
  <span class="meta">AI inbox: email · LMS · Zalo → việc cần làm</span>
</header>
<main>
  <section>
    <div class="card">
      <h2>Thêm thông báo</h2>
      <select id="source"><option value="zalo">Zalo (dán tin nhắn)</option><option value="email">Email</option><option value="lms">LMS</option><option value="manual">Khác</option></select>
      <div class="row"><textarea id="body" placeholder="Dán thông báo vào đây, vd: Thứ 6 tuần này nộp bài tập tuần 9 nhé"></textarea></div>
      <div class="row"><button id="send">Phân tích</button><button class="ghost" id="seed">Nạp dữ liệu demo</button></div>
    </div>
    <div class="card" style="margin-top:16px"><h2>Nhật ký agent</h2><div id="log">Chưa có gì.</div></div>
  </section>
  <section>
    <div class="card"><h2>Bản tin <button class="ghost" id="digestBtn" style="float:right;padding:2px 10px">Làm mới</button></h2><pre id="digest">…</pre></div>
    <div class="card" style="margin-top:16px"><h2>Việc cần làm</h2><div id="tasks"></div></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const fmt = (s) => s ? new Date(s).toLocaleString('vi-VN', {weekday:'short', day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit', timeZone:'Asia/Ho_Chi_Minh'}) : 'Không có hạn';
const CAT = {deadline:'Hạn nộp', exam:'Thi', class_change:'Đổi lịch', event:'Sự kiện', admin:'Thủ tục', other:'Khác'};
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function log(lines) { $('log').replaceChildren(...lines.map((l) => el('div', '', l))); }
function describe(r) {
  if (!r.relevant) return `✗ Bỏ qua (${r.reason}) [${r.mode}]`;
  const c = r.created.map((t) => '＋ ' + t.title), u = r.updated.map((t) => '↻ cập nhật: ' + t.title);
  return `✓ ${CAT[r.category]} [${r.mode}] ` + [...c, ...u].join(' | ');
}
async function loadTasks() {
  const tasks = await (await fetch('/api/tasks')).json();
  const box = $('tasks'); box.replaceChildren();
  if (!tasks.length) box.append(el('div', 'meta', 'Chưa có việc nào.'));
  for (const t of tasks) {
    const row = el('div', 'task');
    row.append(el('span', 'dot ' + t.priority));
    const mid = el('div');
    mid.append(el('div', '', t.title));
    const meta = el('div', 'meta');
    meta.append(el('span', 'tag', CAT[t.category]), el('span', 'tag', t.source));
    meta.append(document.createTextNode(fmt(t.due_at) + (t.location ? ' · ' + t.location : '') + (t.updated_from.length ? ' · đã cập nhật' : '')));
    mid.append(meta);
    const btn = el('button', 'ghost', 'Xong'); btn.onclick = async () => { await fetch(`/api/tasks/${t.id}/done`, {method:'POST'}); refresh(); };
    row.append(mid, btn); box.append(row);
  }
}
async function loadDigest() { $('digest').textContent = '…'; const d = await (await fetch('/api/digest')).json(); $('digest').textContent = d.text; }
async function refresh() { await loadTasks(); await loadDigest(); }
$('send').onclick = async () => {
  const body = $('body').value.trim(); if (!body) return;
  const r = await (await fetch('/api/ingest', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({source: $('source').value, body})})).json();
  log([describe(r)]); $('body').value = ''; refresh();
};
$('seed').onclick = async () => { const rs = await (await fetch('/api/demo/seed', {method:'POST'})).json(); log(rs.map(describe)); refresh(); };
$('digestBtn').onclick = loadDigest;
fetch('/api/health').then((r) => r.json()).then((h) => { $('mode').textContent = h.mode === 'llm' ? 'LLM: ' + h.model : 'Offline (luật)'; });
refresh();
</script>
</body>
</html>
